<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaksCheck</title>
<style>
  /* IBM Plex Mono, bundled: region plate tag, same physical-plate motif as the
     on-ad badge. Static family, real cuts only. */
  @font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:700;
    src:url("fonts/IBMPlexMono-Bold.woff2") format("woff2");font-display:swap}

  :root{
    --blue:#1B54C7;--ruby:#841922;--ink:#101720;--slate:#5A6472;--line:#E1E5EA;
    --mist2:#F1F4F8;--green:#1E7A46;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{width:300px;background:#fff;color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .popmock{border:1px solid var(--line);overflow:hidden}

  .ph{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--mist2);border-bottom:1px solid var(--line)}
  .pm{width:26px;height:18.4px;flex:none;filter:drop-shadow(0 1px 1.5px rgba(16,24,40,.22))}
  .pn{font-weight:800;font-size:14px;letter-spacing:-.01em;color:var(--ink)}
  .pn .c{color:var(--ruby)}

  .pbody{padding:13px}
  .pstat{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);font-weight:600;margin:0 0 12px}
  .pstat .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
  .pstat.off .dot{background:#b4bdc8}

  .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:12px;color:var(--slate);padding:8px 0;border-top:1px solid var(--line)}
  .prow .pright{display:flex;align-items:center;gap:8px}

  .fplate2{display:inline-flex;align-items:stretch;height:19px;border:1px solid #b9c1cb;border-radius:5px;
    overflow:hidden;background:#fff;flex:none;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .fplate2 .eu{background:var(--blue);color:#fff;width:13px;display:flex;align-items:center;justify-content:center;
    font-size:8.5px;font-weight:700;font-family:var(--mono)}
  .fplate2 .rg{padding:0 8px;color:#101720;font-weight:700;font-size:10px;letter-spacing:.05em;
    display:flex;align-items:center;font-family:var(--mono)}

  .pswitch{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:6px;
    background:#fff;color:var(--blue);font-family:inherit;font-size:11px;font-weight:700;
    padding:3px 22px 3px 8px;cursor:pointer;line-height:1.4;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="%231B54C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>');
    background-repeat:no-repeat;background-position:right 7px center}
  .pswitch:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(27,84,199,.28)}

  .plang{color:var(--ink);font-weight:700;font-size:12px}

  .plink{display:block;padding:10px 13px;border-top:1px solid var(--line);
    font-size:12.5px;font-weight:700;color:var(--blue);text-decoration:none}
  .plink:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="popmock">
  <div class="ph">
    <svg class="pm" viewBox="0 0 34 24" aria-hidden="true">
      <rect x="1" y="1" width="32" height="22" rx="4.5" fill="#1B54C7"/>
      <path d="M9.1 2.8 H28.5 A2.7 2.7 0 0 1 31.2 5.5 V18.5 A2.7 2.7 0 0 1 28.5 21.2 H9.1 Z" fill="#fff"/>
      <path d="M12.4 12 L16.4 16 L25 6" fill="none" stroke="#841922" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="pn">Taks<span class="c">Check</span></span>
  </div>
  <div class="pbody">
    <p class="pstat off" id="stat"><span class="dot"></span><span id="statText">No car ad detected</span></p>
    <div class="prow">
      <span>Region</span>
      <span class="pright">
        <span class="fplate2"><span class="eu">B</span><span class="rg" id="plateReg">VLAANDEREN</span></span>
        <select class="pswitch" id="regionSwitch" aria-label="Change region">
          <option value="flanders">Flanders</option>
          <option value="brussels">Brussels</option>
          <option value="wallonia">Wallonia</option>
        </select>
      </span>
    </div>
    <div class="prow">
      <span>Language</span>
      <span class="plang" id="langVal">NL</span>
    </div>
  </div>
  <a class="plink" id="settingsLink" href="#">Change region and settings</a>
  <a class="plink" id="simLink" href="#" target="_blank" rel="noopener">Open the official simulator</a>
</div>
<script src="popup.js"></script>
</body>
</html>
