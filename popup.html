<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaksCheck</title>
<style>
  /* IBM Plex Mono, bundled: the region plate segments, same physical-plate motif
     as the on-ad badge and the options page. Static family, real cuts only. */
  @font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;
    src:url("fonts/IBMPlexMono-SemiBold.woff2") format("woff2");font-display:swap}
  @font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:700;
    src:url("fonts/IBMPlexMono-Bold.woff2") format("woff2");font-display:swap}

  :root{
    color-scheme:light dark;
    --panel:#ffffff;--panel-2:#f7f9fb;--ink:#101720;--ink-soft:#5A6472;
    --line:#e1e5ea;--line-strong:#ccd3db;--blue:#1B54C7;--ruby:#841922;
    --head:#F1F4F8;--link:#1B54C7;--sdot:#1E7A46;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{--panel:#13181e;--panel-2:#0f141a;--ink:#eef2f6;--ink-soft:#9aa5b2;
      --line:#232a32;--line-strong:#333c46;--head:#0f141a;--link:#6f96ea;--sdot:#3aa76a;}
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{width:300px;background:var(--panel);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

  .pop{width:300px;background:var(--panel);color:var(--ink);font-family:var(--sans);
    overflow:hidden;font-size:14px;line-height:1.5}
  .pop-head{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--head);border-bottom:1px solid var(--line)}
  .pop-mark{width:27px;height:19px;flex:none;filter:drop-shadow(0 1px 1.5px rgba(16,24,40,.22))}
  .pop-name{font-weight:800;font-size:15px;letter-spacing:-.02em;color:var(--ink)}
  .pop-name .c{color:var(--ruby)}
  @media (prefers-color-scheme:dark){.pop-name .c{color:var(--ink)}}

  .pop-body{padding:13px}
  .pop-status{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--ink);margin:0 0 15px}
  .pop-status .sdot{width:9px;height:9px;border-radius:50%;flex:none}
  .pop-status.on .sdot{background:var(--sdot);box-shadow:0 0 0 3px rgba(30,122,70,.14)}
  .pop-status.off{color:var(--ink-soft)}
  .pop-status.off .sdot{background:var(--line-strong);box-shadow:none}

  .field{margin:0 0 14px}
  .field:last-of-type{margin-bottom:2px}
  .flabel{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:750;margin:0 0 7px}

  /* branded region switcher: one licence plate, three segments.
     The plate stays a white-field object in both themes (authentic), so its
     colours are fixed and never follow the dark palette. */
  .rsw{display:flex;align-items:stretch;height:32px;border:1px solid #b9c1cb;border-radius:8px;overflow:hidden;
    background:#ffffff;box-shadow:0 1px 0 rgba(0,0,0,.05)}
  .rsw .eu{background:var(--blue);color:#fff;width:22px;flex:none;display:flex;align-items:center;justify-content:center;
    font:800 11px/1 var(--mono)}
  .rsw .seg{flex:1;min-width:0;border:0;border-left:1px solid #ccd3db;background:transparent;color:#101720;
    font:700 10.5px/1 var(--mono);letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;
    padding:0 2px;white-space:nowrap;transition:background .12s ease}
  .rsw .seg:hover{background:rgba(27,84,199,.07)}
  .rsw .seg:focus-visible{outline:none;background:rgba(27,84,199,.10);box-shadow:0 0 0 2px rgba(27,84,199,.55) inset}
  .rsw .seg.sel{background:rgba(27,84,199,.11);color:#0f3aa0;font-weight:800;box-shadow:0 0 0 2px var(--blue) inset}

  /* language toggle: identical to the badge toggle, blue active pill */
  .pop-lang{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
  .pop-lang button{border:0;background:transparent;color:var(--ink-soft);padding:5px 16px;cursor:pointer;
    font:750 12px/1.2 var(--sans)}
  .pop-lang button.on{background:var(--blue);color:#fff}
  .pop-lang button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

  .pop-div{height:1px;background:var(--line);margin:14px -13px 0}
  .pop-links{padding:5px 0 0}
  .pop-link{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:12.5px;font-weight:700;color:var(--link);
    text-decoration:none;border-top:1px solid var(--line);cursor:pointer}
  .pop-link:first-child{border-top:0}
  .pop-link svg{width:15px;height:15px;flex:none;color:var(--link)}
  .pop-link .arw{margin-left:auto;width:13px;height:13px;opacity:.6}
</style>
</head>
<body>
<div class="pop" data-lang="nl" data-region="vl">
  <div class="pop-head">
    <svg class="pop-mark" viewBox="0 0 34 24" aria-hidden="true">
      <rect x="1" y="1" width="32" height="22" rx="4.5" fill="#1B54C7"/>
      <path d="M9.1 2.8 H28.5 A2.7 2.7 0 0 1 31.2 5.5 V18.5 A2.7 2.7 0 0 1 28.5 21.2 H9.1 Z" fill="#fff"/>
      <path d="M12.4 12 L16.4 16 L25 6" fill="none" stroke="#841922" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="pop-name">Taks<span class="c">Check</span></span>
  </div>
  <div class="pop-body">
    <p class="pop-status off" id="stat"><span class="sdot"></span><span id="statText" data-i18n="status"></span></p>

    <div class="field">
      <span class="flabel" data-i18n="region"></span>
      <div class="rsw" id="rsw" role="radiogroup">
        <span class="eu" aria-hidden="true">B</span>
        <button class="seg" type="button" role="radio" aria-checked="false" data-reg="vl"></button>
        <button class="seg" type="button" role="radio" aria-checked="false" data-reg="br"></button>
        <button class="seg" type="button" role="radio" aria-checked="false" data-reg="wa"></button>
      </div>
    </div>

    <div class="field">
      <span class="flabel" data-i18n="language"></span>
      <span class="pop-lang" id="langToggle">
        <button type="button" data-set-lang="nl">NL</button><button type="button" data-set-lang="fr">FR</button>
      </span>
    </div>

    <div class="pop-div"></div>
    <div class="pop-links">
      <a class="pop-link" id="settingsLink" href="#">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 8 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H2a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 3.6 8a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H8a1.6 1.6 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 16 3.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V8a1.6 1.6 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="settings"></span>
        <svg class="arw" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a class="pop-link" id="simLink" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 4h6v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 4l-9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="simulator"></span>
        <svg class="arw" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
